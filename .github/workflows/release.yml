name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Use a stable semantic version tag such as v1.2.3" >&2; exit 1; }
          : "${UPDATE_SIGNING_PUBLIC_KEY:?Set the UPDATE_SIGNING_PUBLIC_KEY repository variable}"
          : "${UPDATE_SIGNING_PRIVATE_KEY:?Set the UPDATE_SIGNING_PRIVATE_KEY secret}"
          printf 'release signing preflight' > "$RUNNER_TEMP/signing-preflight"
          node .github/scripts/sign-update.cjs "$RUNNER_TEMP/signing-preflight"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    name: Build ${{ matrix.asset }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            asset: linux-x64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-x64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build app
        run: |
          export APP_VERSION="${GITHUB_REF_NAME}"
          export APP_VERSION_NUMBER="${APP_VERSION#v}"
          [[ "$APP_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Use a stable semantic version tag such as v1.2.3" >&2; exit 1; }
          : "${UPDATE_SIGNING_PUBLIC_KEY:?Set the UPDATE_SIGNING_PUBLIC_KEY repository variable}"
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.APP_VERSION_NUMBER;
          const config = 'server/cmd/desktop/build/config.yml';
          fs.writeFileSync(config, fs.readFileSync(config, 'utf8').replace(/(^  version:\s*).+$/m, (_, prefix) => prefix + version));
          const plist = 'server/cmd/desktop/build/darwin/Info.plist';
          fs.writeFileSync(plist, fs.readFileSync(plist, 'utf8')
            .replace(/(<key>CFBundleShortVersionString<\/key>\s*<string>)[^<]*/, (_, prefix) => prefix + version)
            .replace(/(<key>CFBundleVersion<\/key>\s*<string>)[^<]*/, (_, prefix) => prefix + version));
          const windowsInfo = 'server/cmd/desktop/build/windows/info.json';
          const info = JSON.parse(fs.readFileSync(windowsInfo, 'utf8'));
          info.fixed.file_version = version;
          info.info['0409'].ProductVersion = version;
          fs.writeFileSync(windowsInfo, JSON.stringify(info, null, '\t') + '\n');
          NODE
          cd server/cmd/desktop
          wails3 package GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            ditto -c -k --sequesterRsrc --keepParent bin/patient-dispatch-planner.app \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}.zip"
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            cp bin/patient-dispatch-planner.exe \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}.exe"
          else
            cp bin/patient-dispatch-planner \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}"
          fi
        shell: bash
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
      - name: Sign and upload build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          asset=("$RUNNER_TEMP"/release-assets/*)
          test "${#asset[@]}" -eq 1 && test -f "${asset[0]}"
          names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          if grep -Fx "$(basename "${asset[0]}")" <<< "$names"; then
            grep -Fx "$(basename "${asset[0]}").sig" <<< "$names" || { echo "Published asset has no signature" >&2; exit 1; }
            echo "Asset already exists; leaving the published build unchanged."
            exit 0
          fi
          node .github/scripts/sign-update.cjs "${asset[0]}"
          gh release upload "$GITHUB_REF_NAME" "${asset[0]}.sig" --clobber
          gh release upload "$GITHUB_REF_NAME" "${asset[0]}"

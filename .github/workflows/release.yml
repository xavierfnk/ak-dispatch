name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            asset: linux-x64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-x64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            asset: macos-arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            asset: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build app
        run: |
          export APP_VERSION="${GITHUB_REF_NAME}"
          export APP_VERSION_NUMBER="${APP_VERSION#v}"
          [[ "$APP_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Use a stable semantic version tag such as v1.2.3" >&2; exit 1; }
          : "${UPDATE_SIGNING_PUBLIC_KEY:?Set the UPDATE_SIGNING_PUBLIC_KEY repository variable}"
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.APP_VERSION_NUMBER;
          const config = 'server/cmd/desktop/build/config.yml';
          fs.writeFileSync(config, fs.readFileSync(config, 'utf8').replace(/(^  version:\s*).+$/m, (_, prefix) => prefix + version));
          const plist = 'server/cmd/desktop/build/darwin/Info.plist';
          fs.writeFileSync(plist, fs.readFileSync(plist, 'utf8')
            .replace(/(<key>CFBundleShortVersionString<\/key>\s*<string>)[^<]*/, (_, prefix) => prefix + version)
            .replace(/(<key>CFBundleVersion<\/key>\s*<string>)[^<]*/, (_, prefix) => prefix + version));
          const windowsInfo = 'server/cmd/desktop/build/windows/info.json';
          const info = JSON.parse(fs.readFileSync(windowsInfo, 'utf8'));
          info.fixed.file_version = version;
          info.info['0409'].ProductVersion = version;
          fs.writeFileSync(windowsInfo, JSON.stringify(info, null, '\t') + '\n');
          NODE
          cd server/cmd/desktop
          wails3 package GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          mkdir -p "$RUNNER_TEMP/release-assets"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            ditto -c -k --sequesterRsrc --keepParent bin/patient-dispatch-planner.app \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}.zip"
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            cp bin/patient-dispatch-planner.exe \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}.exe"
          else
            cp bin/patient-dispatch-planner \
              "$RUNNER_TEMP/release-assets/patient-dispatch-planner-${{ matrix.asset }}"
          fi
        shell: bash
        env:
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_PRIVATE_KEY" || { echo "Set the UPDATE_SIGNING_PRIVATE_KEY secret" >&2; exit 1; }
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY" > "$key"
          public_key=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
          test "$public_key" = "$UPDATE_SIGNING_PUBLIC_KEY" || { echo "Signing key does not match UPDATE_SIGNING_PUBLIC_KEY" >&2; exit 1; }
          for asset in release-assets/*; do
            digest="$asset.sha256"
            sha256sum "$asset" | cut -d' ' -f1 | xxd -r -p > "$digest"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$digest" -out "$asset.sig"
            rm "$digest"
          done
          rm "$key"
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

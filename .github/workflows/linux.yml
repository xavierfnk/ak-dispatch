name: Linux build

on:
  push:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: go test ./...
        working-directory: server
      - run: wails3 package GOOS=linux GOARCH=amd64
        working-directory: server/cmd/desktop
      - run: file server/cmd/desktop/bin/patient-dispatch-planner

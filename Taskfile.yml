version: "3"

tasks:
  dev:
    desc: Run the web app with frontend hot reload
    dir: web
    cmds:
      - npm run dev

  test:
    desc: Run frontend tests
    dir: web
    cmds:
      - npm test

  build:
    desc: Build the static web app
    dir: web
    cmds:
      - npm run build

  check:
    desc: Run tests and the production build
    cmds:
      - task: test
      - task: build

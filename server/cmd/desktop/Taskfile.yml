version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

vars:
  APP_NAME: patient-dispatch-planner
  BIN_DIR: bin
  FRONTEND_DIR: ../../../web
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5173}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{.GOOS}}:build'

  package:
    summary: Packages a production build
    cmds:
      - task: '{{.GOOS}}:package'

  run:
    cmds:
      - task: '{{.GOOS}}:run'

  dev:
    summary: Runs the desktop app with frontend hot reload
    cmds:
      - wails3 dev -config ./build/config.yml

  test:
    summary: Runs the Go tests
    cmds:
      - go test ./...

  check:
    summary: Runs tests and builds the desktop application
    cmds:
      - task: test
      - task: build

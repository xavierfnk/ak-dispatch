version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
    cmds:
      - "node -e \"require('node:fs').mkdirSync('{{.BIN_DIR}}', { recursive: true })\""
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}.exe
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X=main.appVersion={{.VERSION}} -X=main.updatePublicKey={{.UPDATE_PUBLIC_KEY}} -H windowsgui"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default "amd64"}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    deps:
      - task: build
        vars:
          PRODUCTION: "true"

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

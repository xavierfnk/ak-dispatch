version: '3'

info:
  companyName: Patient Dispatch Planner
  productName: Patient Dispatch Planner
  productIdentifier: com.patientdispatchplanner.app
  description: Local patient cohort planning
  copyright: Copyright Patient Dispatch Planner contributors
  comments: Standalone local-first desktop application
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary
